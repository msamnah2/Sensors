<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لعبة المستشعرات</title>
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0b0b2b;--panel:#1a1a4e;--ink:#f4f4ff;--y:#ffd93d;--g:#4dff88;--r:#ff4d6d;--c:#4dd8ff;--p:#c77dff}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Reem Kufi',Tahoma,sans-serif;font-weight:700;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);
background-image:radial-gradient(#fff 1px,transparent 1px),radial-gradient(#8ad 1px,transparent 1px);background-size:60px 60px,90px 90px;background-position:0 0,30px 40px;overflow-x:hidden}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(transparent 0 2px,rgba(0,0,0,.25) 2px 4px)}
.wrap{max-width:520px;margin:0 auto;padding:14px;min-height:100%;display:flex;flex-direction:column;gap:12px}
.box{background:var(--panel);border:4px solid var(--ink);box-shadow:6px 6px 0 #000;padding:14px;text-align:center}
.hud{display:flex;justify-content:space-between;align-items:center;font-size:18px;gap:6px}
.hud b{color:var(--y)}
h1{font-size:34px;margin:6px 0;color:var(--y);text-shadow:3px 3px 0 var(--r)}
.btn{font:inherit;font-size:20px;color:#000;background:var(--g);border:4px solid #000;box-shadow:4px 4px 0 var(--ink);padding:10px 18px;cursor:pointer}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn.alt{background:var(--c)}.btn.warn{background:var(--y)}
.icon{font-size:80px;line-height:1.1;image-rendering:pixelated;filter:contrast(1.2) saturate(1.3);animation:bob 1s steps(2) infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.shake{animation:sh .3s steps(3)}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
input{font:inherit;font-size:22px;width:100%;padding:10px;text-align:center;background:#000;color:var(--g);border:4px solid var(--c);outline:none;margin:8px 0}
.fb{min-height:84px;font-size:19px;line-height:1.5}
.ok{color:var(--g)}.no{color:var(--r)}.hint{color:var(--y)}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.bar{height:14px;background:#000;border:3px solid var(--ink)}
.bar i{display:block;height:100%;background:var(--g);width:0;transition:width .3s steps(6)}
.hidden{display:none}
.blink{animation:bl 1s steps(1) infinite}@keyframes bl{50%{opacity:0}}
</style>
</head>
<body>
<div class="wrap">
 <div id="start" class="box">
  <div style="font-size:54px">🕹️</div>
  <h1>مغامرة المستشعرات</h1>
  <p style="font-size:19px">شاهدي الأيقونة، استنتجي نوع المستشعر، واكتبي اسمه!<br>لديكِ ❤️❤️❤️ ثلاث محاولات.</p>
  <p class="blink" style="color:var(--c)">▶ اضغطي للبدء ◀</p>
  <button class="btn" id="go">ابدئي اللعب</button>
 </div>

 <div id="game" class="hidden">
  <div class="box hud"><span>المستوى <b id="lv">1/7</b></span><span>النقاط <b id="sc">0</b></span><span id="hp">❤️❤️❤️</span><button class="btn alt" id="mute" style="font-size:16px;padding:4px 10px">🔊</button></div>
  <div class="bar" style="margin:12px 0"><i id="pg"></i></div>
  <div class="box" id="card">
   <div class="icon" id="ic"></div>
   <div style="font-size:20px">ما نوع هذا المستشعر؟</div>
   <input id="ans" autocomplete="off" placeholder="اكتبي الإجابة هنا">
   <div class="row"><button class="btn" id="chk">تحقق ✔</button><button class="btn warn" id="hn">تلميح 💡</button></div>
  </div>
  <div class="box fb" id="fb" style="margin-top:12px">اكتبي اسم المستشعر، مثل: مستشعر الحرارة</div>
  <div class="row" style="margin-top:12px"><button class="btn hidden" id="nx">التالي ▶</button></div>
 </div>

 <div id="end" class="box hidden">
  <h1 id="et">انتهت اللعبة!</h1>
  <div style="font-size:56px" id="stars"></div>
  <p style="font-size:22px">نتيجتكِ: <b style="color:var(--y)" id="fs"></b></p>
  <p id="em" style="font-size:19px"></p>
  <button class="btn" id="again">العب مرة أخرى 🔁</button>
 </div>
</div>

<script>
const DATA=[
{i:"🌡️",k:["حرار"],n:"مستشعر الحرارة",h:"يقيس درجة السخونة والبرودة.",e:"مثال: الثلاجة والمكيف يستخدمانه لضبط درجة الحرارة."},
{i:"🏃",k:["حرك"],n:"مستشعر الحركة",h:"يكتشف أي شيء يتحرك أمامه.",e:"مثال: الأبواب الأوتوماتيكية في المراكز التجارية."},
{i:"💡",k:["ضوء","ضو","اضاء","اضائ"],n:"مستشعر الضوء",h:"يتحسس شدة الإضاءة حولنا.",e:"مثال: إنارة الشوارع تضيء ليلًا وتنطفئ نهارًا."},
{i:"🔊",k:["صوت"],n:"مستشعر الصوت",h:"يلتقط الأصوات والضجيج.",e:"مثال: الميكروفون والمساعد الصوتي في الهاتف."},
{i:"🚗➡️⬅️🚙",k:["تقارب","قرب"],n:"مستشعر التقارب",h:"يعرف كم يبعد الجسم عنه.",e:"مثال: حساس السيارة عند الرجوع للخلف."},
{i:"🔥💨",k:["دخان"],n:"مستشعر الدخان",h:"يحس بوجود دخان في الهواء.",e:"مثال: جهاز إنذار الحريق في السقف."},
{i:"👆",k:["لمس"],n:"مستشعر اللمس",h:"يستجيب عند لمسه بالإصبع.",e:"مثال: شاشة الجوال والجهاز اللوحي."}
];
const $=id=>document.getElementById(id);
let Q,idx,score,lives,tries,done,muted=false,ac;
// sound
function beep(seq){if(muted)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();let t=ac.currentTime;seq.forEach(([f,d,ty])=>{const o=ac.createOscillator(),g=ac.createGain();o.type=ty||'square';o.frequency.value=f;g.gain.setValueAtTime(.08,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d);t+=d})}catch(e){}}
const S={ok:()=>beep([[523,.1],[659,.1],[784,.1],[1047,.2]]),no:()=>beep([[200,.15,'sawtooth'],[140,.25,'sawtooth']]),hint:()=>beep([[880,.08],[660,.08]]),click:()=>beep([[440,.05]]),win:()=>beep([[523,.12],[659,.12],[784,.12],[1047,.12],[784,.12],[1047,.3]]),lose:()=>beep([[400,.2],[300,.2],[200,.2],[100,.4]])};
function norm(s){return s.replace(/[\u064B-\u065F\u0640]/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/ؤ/g,'و').replace(/ئ/g,'ي').replace(/ء/g,'').replace(/ه/g,'ه').replace(/\s+/g,'').trim()}
function nk(k){return norm(k)}
function start(){Q=[...DATA].sort(()=>Math.random()-.5);idx=0;score=0;lives=3;$('start').classList.add('hidden');$('end').classList.add('hidden');$('game').classList.remove('hidden');load()}
function hud(){$('lv').textContent=(idx+1)+"/"+Q.length;$('sc').textContent=score;$('hp').textContent="❤️".repeat(lives)+"🖤".repeat(3-lives);$('pg').style.width=(idx/Q.length*100)+"%"}
function load(){tries=0;done=false;const q=Q[idx];$('ic').textContent=q.i;$('ans').value='';$('ans').disabled=false;$('chk').disabled=false;$('hn').disabled=false;$('nx').classList.add('hidden');$('fb').className='box fb';$('fb').textContent='اكتبي اسم المستشعر، مثل: مستشعر الحرارة';hud();setTimeout(()=>$('ans').focus(),50)}
function finishQ(){done=true;$('ans').disabled=true;$('chk').disabled=true;$('hn').disabled=true;$('nx').textContent=(idx+1>=Q.length||lives<=0)?'النتيجة ▶':'التالي ▶';$('nx').classList.remove('hidden');hud()}
function check(){if(done)return;const v=norm($('ans').value);if(!v){$('fb').innerHTML='<span class="hint">اكتبي إجابتكِ أولًا ✏️</span>';S.hint();return}
const q=Q[idx];
if(q.k.some(k=>v.includes(nk(k)))){const pts=tries===0?100:tries===1?60:30;score+=pts;S.ok();$('fb').innerHTML=`<span class="ok">🌟 أحسنتِ! الإجابة صحيحة: ${q.n} (+${pts})</span><br>${q.e}`;finishQ()}
else{tries++;S.no();$('card').classList.remove('shake');void $('card').offsetWidth;$('card').classList.add('shake');
 if(tries>=3){lives--;$('fb').innerHTML=`<span class="no">💥 انتهت المحاولات! الإجابة: ${q.n}</span><br>${q.e}`;finishQ()}
 else $('fb').innerHTML=`<span class="no">❌ ليست صحيحة، حاولي مرة أخرى! (${3-tries} محاولات متبقية)</span><br><span class="hint">${tries>=1?'💡 '+q.h:'فكري في وظيفة المستشعر.'}</span>`}}
function hintBtn(){if(done)return;S.hint();$('fb').innerHTML='<span class="hint">💡 '+Q[idx].h+'</span>'}
function next(){S.click();if(lives<=0||idx+1>=Q.length){idx++;return over()}idx++;load()}
function over(){$('game').classList.add('hidden');$('end').classList.remove('hidden');const max=Q.length*100,pc=score/max,st=pc>.8?3:pc>.5?2:pc>.2?1:0;
$('stars').textContent="⭐".repeat(st)+"☆".repeat(3-st);$('fs').textContent=score+" / "+max;
if(lives<=0){$('et').textContent="انتهت الأرواح 💀";$('em').textContent="لا بأس! جرّبي مرة أخرى وستتقنين المستشعرات.";S.lose()}
else{$('et').textContent="أنهيتِ اللعبة 🏆";$('em').textContent=st==3?"رائع! أنتِ خبيرة المستشعرات!":"عمل جيد! حاولي جمع نقاط أكثر.";S.win()}}
$('go').onclick=()=>{S.click();start()};$('again').onclick=()=>{S.click();start()};
$('chk').onclick=check;$('hn').onclick=hintBtn;$('nx').onclick=next;
$('ans').addEventListener('keydown',e=>{if(e.key==='Enter')check()});
$('mute').onclick=()=>{muted=!muted;$('mute').textContent=muted?'🔇':'🔊'};
</script>
</body>
</html>
